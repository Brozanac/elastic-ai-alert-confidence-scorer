services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: elastic-ai-alert-confidence-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
    volumes:
      - ./backend/alert_history.db:/app/alert_history.db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: elastic-ai-alert-confidence-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend